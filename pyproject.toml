[project]
name = "ai-event-market-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Koushik Sripathi", email = "sripathikoushik244@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.1",
    "feedparser>=6.0.14",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "textblob>=0.20.1",
    "transformers>=5.17.0",
    "yfinance>=1.7.0",
]

[project.scripts]
ai-event-market-prediction = "ai_event_market_prediction:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
